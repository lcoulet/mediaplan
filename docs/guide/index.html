<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentation utilisateur — MediaPlan</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #222;
    margin: 0;
    padding: 24px 20px 60px;
    line-height: 1.55;
    background: #fafafa;
    display: flex;
    gap: 32px;
    justify-content: center;
    align-items: flex-start;
    box-sizing: border-box;
  }
  /* Chapter TOC sidebar (generated from H2s by render-guide.js) */
  #toc {
    width: 230px;
    flex-shrink: 0;
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    font-size: 13.5px;
  }
  #toc .toc-title {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 11.5px;
    color: #888;
    margin: 0 0 8px 0;
  }
  #toc ul { list-style: none; margin: 0; padding: 0; border-left: 2px solid #e2e2e2; }
  #toc li { margin: 0; }
  #toc a {
    display: block;
    padding: 4px 10px;
    color: #555;
    text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -2px;
    line-height: 1.35;
  }
  #toc a:hover { color: #0064ff; background: #f0f4ff; }
  #toc a.active { color: #0064ff; border-left-color: #0064ff; font-weight: 600; }
  #guide { max-width: 860px; flex: 1 1 auto; min-width: 0; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  h2 { font-size: 21px; margin: 28px 0 10px; border-bottom: 2px solid #0064ff33; padding-bottom: 4px; }
  h3 { font-size: 17px; margin: 20px 0 6px; }
  table { border-collapse: collapse; margin: 10px 0; }
  td { border: 1px solid #ccc; padding: 4px 10px; font-size: 14px; }
  ul { padding-left: 22px; margin: 6px 0; }
  li { margin: 3px 0; }
  img { max-width: 100%; border: 1px solid #ccc; border-radius: 6px; margin: 6px 0; display: block; }
  code { background: #eee; border-radius: 3px; padding: 1px 5px; font-size: 13px; }
  hr { border: none; border-top: 1px solid #ccc; margin: 20px 0; }
  em { color: #555; }
  a { color: #0064ff; }
  .load-error { color: #b00; padding: 20px; }
  /* Narrow screens: the TOC collapses, the guide takes the full width */
  @media (max-width: 900px) {
    body { display: block; }
    #toc { display: none; }
    #guide { max-width: 860px; margin: 0 auto; }
  }
</style>
</head>
<body>
<nav id="toc" aria-label="Sommaire"><p class="toc-title">Sommaire</p></nav>
<div id="guide"></div>
<script src="render-guide.js"></script>
</body>
</html>
